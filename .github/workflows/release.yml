name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tag and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          ALLOWED_SIGNERS: ${{ vars.ALLOWED_SIGNERS }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Expected a tag ref"
            exit 1
          fi

          if [[ -z "$ALLOWED_SIGNERS" ]]; then
            echo "::error::Set the ALLOWED_SIGNERS repository variable"
            exit 1
          fi

          allowed_signers="$RUNNER_TEMP/allowed_signers"
          printf "$ALLOWED_SIGNERS" > "$allowed_signers"

          git \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$TAG"

          # Ensure the tag names the source revision checked out by this job.
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Tag target does not match checked-out HEAD"
            exit 1
          fi

          echo "Verified signed release tag $TAG at $tag_commit"

  build:
    name: Build and attest image
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
      packages: write

    uses: docker/github-builder/.github/workflows/build.yml@v1

    with:
      output: image
      file: ./Containerfile
      push: true
      sbom: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=tag
        type=semver,pattern={{version}}

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Publish GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
