# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          ALLOWED_SIGNERS: ${{ vars.ALLOWED_SIGNERS }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Expected a tag ref"
            exit 1
          fi

          if [[ -z "$ALLOWED_SIGNERS" ]]; then
            echo "::error::Set the ALLOWED_SIGNERS repository variable"
            exit 1
          fi

          allowed_signers="$RUNNER_TEMP/allowed_signers"
          printf "$ALLOWED_SIGNERS" > "$allowed_signers"

          git \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$TAG"

          # Ensure the tag names the source revision checked out by this job.
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Tag target does not match checked-out HEAD"
            exit 1
          fi

          echo "Verified signed release tag $TAG at $tag_commit"

  build:
    name: Build and attest image
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
      packages: write

    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1

    with:
      output: image
      file: ./Containerfile
      push: true
      sbom: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      meta-annotations: |
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.source=https://github.com/${{ github.repository }}

    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
